    // =========================================================================
    function getSetCounts(equippedIds, inventoryMap) {
      const counts = {};
      Object.values(equippedIds).forEach(artId => {
        const art = inventoryMap[artId];
        if (art && art.set) {
          counts[art.set] = (counts[art.set] || 0) + 1;
        }
      });
      return counts;
    }

    function computeResonances(team) {
      const elems = team.map(m => CHARACTERS_DB[m.charId]?.element).filter(Boolean);
      const counts = {};
      elems.forEach(e => counts[e] = (counts[e] || 0) + 1);
      const uniqueCount = Object.keys(counts).length;

      const active = [];
      const teamStats = {};

      if (counts.Pyro >= 2) {
        active.push({ name: 'Résonance Pyro (Flamme)', desc: '+25% ATQ' });
        teamStats.atk_ = (teamStats.atk_ || 0) + 25;
      }
      if (counts.Hydro >= 2) {
        active.push({ name: 'Résonance Hydro (Eau)', desc: '+25% PV Max' });
        teamStats.hp_ = (teamStats.hp_ || 0) + 25;
      }
      if (counts.Cryo >= 2) {
        active.push({ name: 'Résonance Cryo (Glace)', desc: '+15% Taux CRIT' });
        teamStats.cr = (teamStats.cr || 0) + 15;
      }
      if (counts.Dendro >= 2) {
        active.push({ name: 'Résonance Dendro (Plante)', desc: '+80 Maîtrise Élémentaire' });
        teamStats.em = (teamStats.em || 0) + 80;
      }
      if (counts.Geo >= 2) {
        active.push({ name: 'Résonance Géo (Roche)', desc: '+15% Bonus DGT & -20% RÉS Géo' });
        teamStats.dmg_ = (teamStats.dmg_ || 0) + 15;
        teamStats.resShred = (teamStats.resShred || 0) + 20;
      }
      if (counts.Anemo >= 2) {
        active.push({ name: 'Résonance Anémo (Vent)', desc: '-5% Temps de recharge' });
      }
      if (counts.Electro >= 2) {
        active.push({ name: 'Résonance Électro (Tonnerre)', desc: 'Particules Électro bonus' });
      }
      if (uniqueCount === 4) {
        active.push({ name: 'Canopée Protectrice (4 élém.)', desc: '+15% RÉS Élém. & Physique' });
      }

      return { active, teamStats };
    }

    function computeTeamBuffs(team, inventoryMap) {
      const { active: resonances, teamStats: resStats } = computeResonances(team);
      const globalBuffs = { ...resStats };
      const activeBuffList = [...resonances];

      team.forEach((member) => {
        const char = CHARACTERS_DB[member.charId];
        const weapon = WEAPONS_DB.find(w => w.id === member.weaponId);
        if (!char) return;

        // Character team buffs
        char.buffs.forEach(b => {
          if (b.team && member.activeBuffs?.[b.id]) {
            activeBuffList.push({ name: `${char.name} — ${b.name.split(':')[0]}`, desc: b.name.split(':')[1] || '' });
            Object.entries(b.stats).forEach(([k, v]) => {
              globalBuffs[k] = (globalBuffs[k] || 0) + v;
            });
          }
        });

        // Weapon team buffs
        if (weapon && weapon.teamStats) {
          activeBuffList.push({ name: `${weapon.name}`, desc: Object.entries(weapon.teamStats).map(([k, v]) => `+${v} ${STAT_LABELS[k] || k}`).join(', ') });
          Object.entries(weapon.teamStats).forEach(([k, v]) => {
            globalBuffs[k] = (globalBuffs[k] || 0) + v;
          });
        }

        // Artifact 4pc team buffs
        const setCounts = getSetCounts(member.equipped, inventoryMap);
        Object.entries(setCounts).forEach(([setId, count]) => {
          if (count >= 4 && ARTIFACT_SETS[setId]?.teamBonus4) {
            const setObj = ARTIFACT_SETS[setId];
            activeBuffList.push({ name: `Set 4p ${setObj.name}`, desc: setObj.desc.split('|')[1] || setObj.desc });
            Object.entries(setObj.teamBonus4).forEach(([k, v]) => {
              globalBuffs[k] = (globalBuffs[k] || 0) + v;
            });
          }
        });
      });

      return { globalBuffs, activeBuffList };
    }

    function calculateCharacterStats(member, inventoryMap, globalBuffs, customEquipped = null) {
      const char = CHARACTERS_DB[member.charId];
      const weapon = WEAPONS_DB.find(w => w.id === member.weaponId) || WEAPONS_DB[0];
      const equipped = customEquipped || member.equipped;

      const baseHp = char.baseHp;
      const baseAtk = char.baseAtk + weapon.baseAtk;
      const baseDef = char.baseDef;

      const bonus = {
        hp: 0, hp_: 0,
        atk: 0, atk_: 0,
        def: 0, def_: 0,
        em: 0,
        er: 100,
        cr: 5.0,
        cd: 50.0,
        dmg_: 0,
        naDmg_: 0, caDmg_: 0, skillDmg_: 0, burstDmg_: 0,
        pyro_: 0, hydro_: 0, cryo_: 0, electro_: 0, dendro_: 0, anemo_: 0, geo_: 0,
      };

      // Ascension stat
      if (char.ascension) {
        bonus[char.ascension.stat] = (bonus[char.ascension.stat] || 0) + char.ascension.value;
      }

      // Weapon substat & personal passive
      if (weapon.subStat) {
        bonus[weapon.subStat.stat] = (bonus[weapon.subStat.stat] || 0) + weapon.subStat.value;
      }
      if (weapon.passive) {
        Object.entries(weapon.passive).forEach(([k, v]) => {
          bonus[k] = (bonus[k] || 0) + v;
        });
      }

      // Character personal buffs
      char.buffs.forEach(b => {
        if (!b.team && member.activeBuffs?.[b.id]) {
          Object.entries(b.stats).forEach(([k, v]) => {
            bonus[k] = (bonus[k] || 0) + v;
          });
        }
      });

      // Global Team Buffs
      Object.entries(globalBuffs).forEach(([k, v]) => {
        if (k !== 'resShred' && k !== 'defShred') {
          bonus[k] = (bonus[k] || 0) + v;
        }
      });

      // Equipped Artifacts Stats
      Object.values(equipped).forEach(artId => {
        const art = inventoryMap[artId];
        if (!art) return;
        const mainVal = MAIN_STAT_VALUES[art.main] || 0;
        bonus[art.main] = (bonus[art.main] || 0) + mainVal;
        if (art.subs) {
          Object.entries(art.subs).forEach(([sKey, sVal]) => {
            bonus[sKey] = (bonus[sKey] || 0) + (parseFloat(sVal) || 0);
          });
        }
      });

      // Artifact Set Bonuses
      const setCounts = getSetCounts(equipped, inventoryMap);
      let hasEmblem4 = false;
      Object.entries(setCounts).forEach(([setId, count]) => {
        const setObj = ARTIFACT_SETS[setId];
        if (!setObj) return;
        if (count >= 2 && setObj.bonus2) {
          Object.entries(setObj.bonus2).forEach(([k, v]) => bonus[k] = (bonus[k] || 0) + v);
        }
        if (count >= 4 && setObj.bonus4) {
          if (setObj.bonus4.emblemScale) hasEmblem4 = true;
          Object.entries(setObj.bonus4).forEach(([k, v]) => {
            if (k !== 'emblemScale') bonus[k] = (bonus[k] || 0) + v;
          });
        }
      });

      if (hasEmblem4) {
        const emblemBonus = Math.min(75, bonus.er * 0.25);
        bonus.burstDmg_ += emblemBonus;
      }

      const totalHp = baseHp * (1 + bonus.hp_ / 100) + bonus.hp;
      const totalAtk = baseAtk * (1 + bonus.atk_ / 100) + bonus.atk;
      const totalDef = baseDef * (1 + bonus.def_ / 100) + bonus.def;
      const effectiveCr = Math.min(100, Math.max(0, bonus.cr));
      const elemKey = `${char.element.toLowerCase()}_`;
      const elemDmg = (bonus[elemKey] || 0) + bonus.dmg_;

      return {
        baseHp, baseAtk, baseDef,
        totalHp, totalAtk, totalDef,
        em: bonus.em,
        er: bonus.er,
        cr: effectiveCr,
        rawCr: bonus.cr,
        cd: bonus.cd,
        elemDmg,
        naDmg_: bonus.naDmg_,
        caDmg_: bonus.caDmg_,
        skillDmg_: bonus.skillDmg_,
        burstDmg_: bonus.burstDmg_,
        setCounts
      };
    }

    function calculateHitDamage(char, stats, talentKey, reaction, enemyConfig, globalBuffs) {
      const talent = char.talents[talentKey];
      if (!talent) return { nonCrit: 0, crit: 0, avg: 0 };

      // 1. Base Damage (Scaling Stat * Multiplier)
      let scalingStatVal = stats.totalAtk;
      if (talent.scale === 'hp') scalingStatVal = stats.totalHp;
      if (talent.scale === 'def') scalingStatVal = stats.totalDef;

      let baseDmg = scalingStatVal * (talent.mult / 100);
      if (talent.scaleEm) {
        baseDmg += stats.em * (talent.scaleEm / 100);
      }

      // Additive Reaction (Aggravate / Spread)
      if (reaction === 'aggravate' || reaction === 'spread') {
        const levelMult = 1446.85; // Lv 90 base reaction
        const reactMult = reaction === 'spread' ? 1.25 : 1.15;
        const emBonus = (5 * stats.em) / (stats.em + 1200);
        baseDmg += levelMult * reactMult * (1 + emBonus);
      }

      // 2. DMG Bonus %
      let specificDmg = 0;
      if (talent.type === 'NA') specificDmg = stats.naDmg_;
      if (talent.type === 'CA') specificDmg = stats.caDmg_;
      if (talent.type === 'Skill') specificDmg = stats.skillDmg_;
      if (talent.type === 'Burst') specificDmg = stats.burstDmg_;

      const dmgBonusMult = 1 + (stats.elemDmg + specificDmg) / 100;

      // 3. Amplifying Reaction Multiplier (Vaporize / Melt)
      let ampMult = 1.0;
      if (reaction === 'vape_15' || reaction === 'melt_15') {
        const emBonus = (2.78 * stats.em) / (stats.em + 1400);
        ampMult = 1.5 * (1 + emBonus);
      } else if (reaction === 'vape_20' || reaction === 'melt_20') {
        const emBonus = (2.78 * stats.em) / (stats.em + 1400);
        ampMult = 2.0 * (1 + emBonus);
      }

      // 4. Enemy DEF Multiplier
      const charLv = 90;
      const enemyLv = enemyConfig.level || 90;
      const defShred = (enemyConfig.defShred || 0) + (globalBuffs.defShred || 0);
      const defMult = (charLv + 100) / ((charLv + 100) + (enemyLv + 100) * (1 - defShred / 100));

      // 5. Enemy RES Multiplier
      const baseRes = (enemyConfig.baseRes ?? 10) / 100;
      const shred = (globalBuffs.resShred || 0) / 100;
      const effRes = baseRes - shred;
      let resMult = 1 - effRes;
      if (effRes < 0) {
        resMult = 1 - (effRes / 2);
      } else if (effRes >= 0.75) {
        resMult = 1 / (4 * effRes + 1);
      }

      const nonCrit = baseDmg * dmgBonusMult * ampMult * defMult * resMult;
      const crit = nonCrit * (1 + stats.cd / 100);
      const crProb = stats.cr / 100;
      const avg = nonCrit * (1 - crProb) + crit * crProb;

      return { nonCrit, crit, avg };
    }

    // =========================================================================

    // =========================================================================
    const formatNum = (n) => Math.round(n).toLocaleString('fr-FR');

      const [rotationDuration, setRotationDuration] = useState(20);

          localStorage.setItem('stellar_tc_team_v1', JSON.stringify(team));
          localStorage.setItem('stellar_tc_rot_v1', JSON.stringify(rotation));
        } catch (e) {}
      }, [inventory, team, rotation]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      const inventoryMap = useMemo(() => {
        const map = {};
        inventory.forEach(a => map[a.id] = a);
        return map;
      }, [inventory]);

      // Team Buffs & Calculated Stats for all 4 slots
      const { globalBuffs, activeBuffList } = useMemo(() => computeTeamBuffs(team, inventoryMap), [team, inventoryMap]);

      const teamStats = useMemo(() => {
        return team.map(member => calculateCharacterStats(member, inventoryMap, globalBuffs));
      }, [team, inventoryMap, globalBuffs]);

      // Full Rotation Simulation Results
      const simulationResults = useMemo(() => {
        let totalDamage = 0;
        const charDamages = [0, 0, 0, 0];

        const rows = rotation.map(step => {
          const member = team[step.slotIdx];
          if (!member) return { ...step, nonCrit: 0, crit: 0, avgPerHit: 0, totalStepDmg: 0 };
          const char = CHARACTERS_DB[member.charId];
          const stats = teamStats[step.slotIdx];
          const dmg = calculateHitDamage(char, stats, step.talentKey, step.reaction, enemyConfig, globalBuffs);
          const totalStepDmg = dmg.avg * (step.hits || 1);
          totalDamage += totalStepDmg;
          charDamages[step.slotIdx] += totalStepDmg;
          return {
            ...step,
            char,
            nonCrit: dmg.nonCrit,
            crit: dmg.crit,
            avgPerHit: dmg.avg,
            totalStepDmg
          };
        });

        const dps = rotationDuration > 0 ? totalDamage / rotationDuration : 0;
        return { rows, totalDamage, dps, charDamages };
      }, [rotation, team, teamStats, enemyConfig, globalBuffs, rotationDuration]);

      const updateTeamMember = (idx, updates) => {
        setTeam(prev => prev.map((m, i) => i === idx ? { ...m, ...updates } : m));

              <span className="w-2 h-2 rounded-full bg-amber-400"></span>

                onCharacterChange={handleCharacterChange}

                enemyConfig={enemyConfig}

                setRotation={setRotation}
                rotationDuration={rotationDuration}

                simulationResults={simulationResults}
                saveSnapshot={saveSnapshot}

                team={team}
                selectedSlotIdx={selectedSlotIdx}
                setSelectedSlotIdx={setSelectedSlotIdx}
                inventory={inventory}
                inventoryMap={inventoryMap}
                globalBuffs={globalBuffs}
                enemyConfig={enemyConfig}
                rotation={rotation}
                rotationDuration={rotationDuration}
                updateTeamMember={updateTeamMember}
                showToast={showToast}
                setActiveTab={setActiveTab}
              />
            )}

            {activeTab === 'inventory' && (
              <InventoryTab
                inventory={inventory}
                setInventory={setInventory}
                team={team}
                setTeam={setTeam}
                rotation={rotation}
                setRotation={setRotation}
                showToast={showToast}
              />
            )}

            {activeTab === 'comparator' && (
              <ComparatorTab
                compA={compA}
                compB={compB}
                saveSnapshot={saveSnapshot}
                simulationResults={simulationResults}
              />
            )}
          </main>
        </div>
      );
    }

    // =========================================================================
    // TAB 2 : OPTIMISEUR D'ARTÉFACTS COMBINATOIRE
    // =========================================================================
    function OptimizerTab({
      team, selectedSlotIdx, setSelectedSlotIdx,
      inventory, inventoryMap, globalBuffs, enemyConfig,
      rotation, rotationDuration, updateTeamMember, showToast, setActiveTab
    }) {
      const [minEr, setMinEr] = useState(110);
      const [forcedSet, setForcedSet] = useState('any');
      const [results, setResults] = useState([]);
      const [isComputing, setIsComputing] = useState(false);

      const targetMember = team[selectedSlotIdx];
      const targetChar = CHARACTERS_DB[targetMember.charId];

      const runOptimization = () => {
        setIsComputing(true);
        setTimeout(() => {
          const flowers = inventory.filter(a => a.slot === 'flower');
          const plumes = inventory.filter(a => a.slot === 'plume');
          const sands = inventory.filter(a => a.slot === 'sands');
          const goblets = inventory.filter(a => a.slot === 'goblet');
          const circlets = inventory.filter(a => a.slot === 'circlet');

          const candidates = [];
          const charSteps = rotation.filter(s => s.slotIdx === selectedSlotIdx);
          const stepsToEval = charSteps.length > 0
            ? charSteps
            : [{ talentKey: 'skill', hits: 1, reaction: 'none' }, { talentKey: 'burst', hits: 1, reaction: 'none' }];

          for (const f of flowers) {
            for (const p of plumes) {
              for (const s of sands) {
                for (const g of goblets) {
                  for (const c of circlets) {
                    const eq = { flower: f.id, plume: p.id, sands: s.id, goblet: g.id, circlet: c.id };
                    const stats = calculateCharacterStats(targetMember, inventoryMap, globalBuffs, eq);

                    // Constraint: Min ER
                    if (stats.er < minEr) continue;

                    // Constraint: Forced Set
                    if (forcedSet !== 'any') {
                      if ((stats.setCounts[forcedSet] || 0) < 4) continue;
                    }

                    // Evaluate total damage for target character's rotation actions
                    let scoreDmg = 0;
                    for (const step of stepsToEval) {
                      const d = calculateHitDamage(targetChar, stats, step.talentKey, step.reaction, enemyConfig, globalBuffs);
                      scoreDmg += d.avg * (step.hits || 1);
                    }

                    candidates.push({ eq, stats, scoreDmg });
                  }
                }
              }
            }
          }

          candidates.sort((a, b) => b.scoreDmg - a.scoreDmg);
          setResults(candidates.slice(0, 6));
          setIsComputing(false);
          showToast(`${candidates.length} combinaisons valides analysées !`);
        }, 50);
      };

      const equipBuild = (eq) => {
        updateTeamMember(selectedSlotIdx, { equipped: eq });
        showToast(`Build optimisé équipé sur ${targetChar.name} !`);
        setActiveTab('team');
      };

      return (
        <div className="space-y-6">
          <div className="bg-card rounded-2xl border border-borderSubtle p-6">
            <h2 className="font-semibold text-lg text-slate-100 mb-1">Optimiseur Combinatoire d'Artéfacts</h2>
            <p className="text-xs text-slate-400 mb-5">
              Évalue toutes les combinaisons possibles de votre inventaire (Fleur × Plume × Sablier × Coupe × Couronne) en tenant compte des buffs d'équipe, des résonances et des réactions de votre rotation.
            </p>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
              <div>
                <label className="block text-xs text-slate-400 mb-1.5">Personnage Cible</label>
                <select
                  value={selectedSlotIdx}
                  onChange={(e) => setSelectedSlotIdx(Number(e.target.value))}
                  className="w-full bg-void border border-borderSubtle rounded-xl px-3 py-2 text-sm text-slate-200"
                >
                  {team.map((m, i) => (
                    <option key={i} value={i}>Slot {i + 1} : {CHARACTERS_DB[m.charId].name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs text-slate-400 mb-1.5">Recharge d'Énergie Min. (%)</label>
                <input
                  type="number"
                  value={minEr}
                  onChange={(e) => setMinEr(Number(e.target.value))}
                  className="w-full bg-void border border-borderSubtle rounded-xl px-3 py-2 text-sm font-mono text-slate-200"
                />
              </div>

              <div>
                <label className="block text-xs text-slate-400 mb-1.5">Contrainte de Set (4 pièces)</label>
                <select
                  value={forcedSet}
                  onChange={(e) => setForcedSet(e.target.value)}
                  className="w-full bg-void border border-borderSubtle rounded-xl px-3 py-2 text-sm text-slate-200"
                >
                  <option value="any">Libre (Meilleurs stats / 2p+2p / 4p)</option>
                  {Object.values(ARTIFACT_SETS).map(s => (
                    <option key={s.id} value={s.id}>4p {s.name}</option>
                  ))}
                </select>
              </div>

              <button
                onClick={runOptimization}
                disabled={isComputing}
                className="w-full py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-void font-bold text-sm transition shadow-lg shadow-amber-500/20"
              >
                {isComputing ? 'Calcul en cours...' : 'Lancer l’Optimisation'}
              </button>
            </div>
          </div>

          {/* Results List */}
          {results.length > 0 && (
            <div className="space-y-4">
              <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-300">
                Top {results.length} Combinaisons Optimales pour {targetChar.name}
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {results.map((res, idx) => (
                  <div key={idx} className="bg-card rounded-2xl border border-borderSubtle p-4 flex flex-col justify-between gap-4 hover:border-amber-500/50 transition">
                    <div>
                      <div className="flex items-center justify-between border-b border-borderSubtle pb-3 mb-3">
                        <div className="flex items-center gap-2">
                          <span className={`px-2.5 py-0.5 rounded-lg font-mono font-bold text-xs ${idx === 0 ? 'bg-amber-500 text-void' : 'bg-void text-slate-300 border border-borderSubtle'}`}>
                            #{idx + 1}
                          </span>
                          <div className="flex flex-wrap gap-1">
                            {Object.entries(res.stats.setCounts).filter(([_, c]) => c >= 2).map(([sId, c]) => (
                              <span key={sId} className="text-[11px] px-2 py-0.5 rounded bg-sky-500/15 text-sky-300 border border-sky-500/30">
                                {ARTIFACT_SETS[sId]?.name} ({c >= 4 ? '4p' : '2p'})
                              </span>
                            ))}
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="text-[10px] text-slate-400 uppercase">DGT Rotation Perso</div>
                          <div className="font-mono font-bold text-amber-400 text-base">{formatNum(res.scoreDmg)}</div>
                        </div>
                      </div>

                      <div className="grid grid-cols-4 gap-2 text-center bg-void/70 p-2.5 rounded-xl border border-borderSubtle/70 text-xs mb-3">
                        <div>
                          <div className="text-[10px] text-slate-400">ATQ / PV / DÉF</div>
                          <div className="font-mono text-slate-200">{formatNum(res.stats.totalAtk)} / {formatNum(res.stats.totalHp)}</div>
                        </div>
                        <div>
                          <div className="text-[10px] text-slate-400">CRIT</div>
                          <div className="font-mono text-emerald-400">{res.stats.cr.toFixed(1)}% / {res.stats.cd.toFixed(1)}%</div>
                        </div>
                        <div>
                          <div className="text-[10px] text-slate-400">ME</div>
                          <div className="font-mono text-slate-200">{Math.round(res.stats.em)}</div>
                        </div>
                        <div>
                          <div className="text-[10px] text-slate-400">RE %</div>
                          <div className="font-mono text-sky-300">{res.stats.er.toFixed(1)}%</div>
                        </div>
                      </div>

                      <div className="space-y-1 text-[11px] text-slate-400">
                        {Object.entries(res.eq).map(([slot, artId]) => {
                          const a = inventoryMap[artId];
                          return (
                            <div key={slot} className="flex justify-between">
                              <span className="text-slate-300 font-medium">{SLOT_NAMES[slot].split(' ')[0]} :</span>
                              <span className="truncate max-w-[260px]">
                                {ARTIFACT_SETS[a.set]?.name} — <span className="text-amber-300">{STAT_LABELS[a.main]}</span>
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <button
                      onClick={() => equipBuild(res.eq)}
                      className="w-full py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 font-semibold text-xs transition"
                    >
                      Équiper ce build sur {targetChar.name}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // TAB 3 : INVENTAIRE & IMPORT / EXPORT JSON
    // =========================================================================
    function InventoryTab({ inventory, setInventory, team, setTeam, rotation, setRotation, showToast }) {
      const [newArt, setNewArt] = useState({
        set: 'marechaussee',
        slot: 'flower',
        main: 'hp',
        s1k: 'cr', s1v: 10.5,
        s2k: 'cd', s2v: 21.0,
        s3k: 'atk_', s3v: 9.9,
        s4k: 'er', s4v: 5.8,
      });

      const [jsonText, setJsonText] = useState('');

      const handleSlotChange = (slot) => {
        setNewArt(prev => ({
          ...prev,
          slot,
          main: SLOT_MAIN_OPTIONS[slot][0]
        }));
      };

      const addArtifact = (e) => {
        e.preventDefault();
        const subs = {};
        if (newArt.s1v > 0) subs[newArt.s1k] = Number(newArt.s1v);
        if (newArt.s2v > 0) subs[newArt.s2k] = Number(newArt.s2v);
        if (newArt.s3v > 0) subs[newArt.s3k] = Number(newArt.s3v);
        if (newArt.s4v > 0) subs[newArt.s4k] = Number(newArt.s4v);

        const created = {
          id: `art_custom_${Date.now()}`,
          set: newArt.set,
          slot: newArt.slot,
          main: newArt.main,
          subs
        };

        setInventory(prev => [created, ...prev]);
        showToast('Nouvel artéfact ajouté à l’inventaire !');
      };

      const deleteArtifact = (id) => {
        setInventory(prev => prev.filter(a => a.id !== id));
      };

      const handleExportJson = () => {
        const payload = JSON.stringify({ format: 'STELLAR_THEORYCRAFT_V1', team, rotation, inventory }, null, 2);
        setJsonText(payload);
        navigator.clipboard?.writeText(payload);
        showToast('Configuration complète exportée et copiée dans le presse-papiers !');
      };

      const handleImportJson = () => {
        try {
          const parsed = JSON.parse(jsonText);
          if (parsed.inventory) setInventory(parsed.inventory);
          if (parsed.team) setTeam(parsed.team);
          if (parsed.rotation) setRotation(parsed.rotation);
          showToast('Données importées avec succès !');
        } catch (err) {
          showToast('Erreur : JSON invalide.');
        }
      };

      const subKeys = ['cr', 'cd', 'atk_', 'hp_', 'def_', 'em', 'er', 'atk', 'hp', 'def'];

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          {/* Left: Add Artifact Form & JSON Import/Export (5 cols) */}
          <div className="lg:col-span-5 space-y-6">
            <form onSubmit={addArtifact} className="bg-card rounded-2xl border border-borderSubtle p-5 space-y-4">
              <h3 className="font-semibold text-base text-slate-100">Ajouter un Artéfact 5★</h3>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Set</label>
                  <select
                    value={newArt.set}
                    onChange={(e) => setNewArt({ ...newArt, set: e.target.value })}
                    className="w-full bg-void border border-borderSubtle rounded-xl px-2.5 py-2 text-xs text-slate-200"
                  >
                    {Object.values(ARTIFACT_SETS).map(s => (
                      <option key={s.id} value={s.id}>{s.name}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Pièce</label>
                  <select
                    value={newArt.slot}
                    onChange={(e) => handleSlotChange(e.target.value)}
                    className="w-full bg-void border border-borderSubtle rounded-xl px-2.5 py-2 text-xs text-slate-200"
                  >
                    {Object.entries(SLOT_NAMES).map(([k, v]) => (
                      <option key={k} value={k}>{v}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs text-slate-400 mb-1">Statistique Principale (+20)</label>
                <select
                  value={newArt.main}
                  onChange={(e) => setNewArt({ ...newArt, main: e.target.value })}
                  className="w-full bg-void border border-borderSubtle rounded-xl px-2.5 py-2 text-xs text-amber-300 font-medium"
                >
                  {SLOT_MAIN_OPTIONS[newArt.slot].map(m => (
                    <option key={m} value={m}>{STAT_LABELS[m]} (+{MAIN_STAT_VALUES[m]})</option>
                  ))}
                </select>
              </div>

              <div className="space-y-2">
                <label className="block text-xs text-slate-400">4 Substats</label>
                {[1, 2, 3, 4].map(n => (
                  <div key={n} className="grid grid-cols-3 gap-2">
                    <select
                      value={newArt[`s${n}k`]}
                      onChange={(e) => setNewArt({ ...newArt, [`s${n}k`]: e.target.value })}
                      className="col-span-2 bg-void border border-borderSubtle rounded-lg px-2 py-1.5 text-xs text-slate-200"
                    >
                      {subKeys.map(sk => (
                        <option key={sk} value={sk}>{STAT_LABELS[sk]}</option>
                      ))}
                    </select>
                    <input
                      type="number"
                      step="0.1"
                      value={newArt[`s${n}v`]}
                      onChange={(e) => setNewArt({ ...newArt, [`s${n}v`]: e.target.value })}
                      className="bg-void border border-borderSubtle rounded-lg px-2 py-1.5 text-xs font-mono text-slate-200"
                    />
                  </div>
                ))}
              </div>

              <button type="submit" className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-void font-bold text-xs transition">
                + Ajouter à l'Inventaire
              </button>
            </form>

            {/* Import / Export JSON */}
            <div className="bg-card rounded-2xl border border-borderSubtle p-5 space-y-3">
              <h3 className="font-semibold text-sm text-slate-100 uppercase tracking-wider">Import / Export JSON</h3>
              <p className="text-xs text-slate-400">
                Sauvegardez ou partagez votre équipe, rotation et inventaire au format JSON.
              </p>
              <textarea
                rows="4"
                value={jsonText}
                onChange={(e) => setJsonText(e.target.value)}
                placeholder="Collez un JSON ici pour importer ou cliquez sur Exporter..."
                className="w-full bg-void border border-borderSubtle rounded-xl p-2.5 text-xs font-mono text-slate-300 focus:outline-none focus:border-amber-400"
              />
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={handleExportJson}
                  className="py-2 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/40 text-sky-300 text-xs font-semibold transition"
                >
                  Exporter JSON
                </button>
                <button
                  onClick={handleImportJson}
                  className="py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 text-xs font-semibold transition"
                >
                  Importer JSON
                </button>
              </div>
              <button
                onClick={() => {
                  setInventory(generateDemoInventory());
                  showToast('Inventaire par défaut restauré.');
                }}
                className="w-full py-1.5 rounded-lg bg-void border border-borderSubtle text-slate-400 hover:text-slate-200 text-xs transition"
              >
                Réinitialiser l'inventaire démo (45 artéfacts)
              </button>
            </div>
          </div>

          {/* Right: Artifact Grid (7 cols) */}
          <div className="lg:col-span-7 bg-card rounded-2xl border border-borderSubtle p-5">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold text-base text-slate-100">
                Artéfacts en Stock ({inventory.length})
              </h3>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[720px] overflow-y-auto pr-1">
              {inventory.map(art => (
                <div key={art.id} className="bg-void/90 p-3.5 rounded-xl border border-borderSubtle flex flex-col justify-between">
                  <div>
                    <div className="flex items-start justify-between gap-2 mb-1.5">
                      <span className="text-xs font-semibold text-amber-300">{ARTIFACT_SETS[art.set]?.name}</span>
                      <button
                        onClick={() => deleteArtifact(art.id)}
                        className="text-slate-500 hover:text-red-400 text-xs"
                        title="Supprimer"
                      >
                        ✕
                      </button>
                    </div>
                    <div className="text-[11px] text-slate-400 mb-2">
                      {SLOT_NAMES[art.slot]} • <span className="text-slate-200 font-medium">{STAT_LABELS[art.main]} (+{MAIN_STAT_VALUES[art.main]})</span>
                    </div>
                    <div className="grid grid-cols-2 gap-1 text-[11px] font-mono text-slate-300 bg-card/70 p-2 rounded-lg">
                      {Object.entries(art.subs).map(([k, v]) => (
                        <div key={k}>• {STAT_LABELS[k].split(' ')[0]}: +{v}</div>
                      ))}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // TAB 4 : COMPARATEUR DE CONFIGURATIONS (A vs B)
    // =========================================================================
    function ComparatorTab({ compA, compB, saveSnapshot, simulationResults }) {
      const renderDelta = (valA, valB) => {
        if (!valA || !valB) return null;
        const diff = ((valB - valA) / valA) * 100;
        const isPos = diff >= 0;
        return (
          <span className={`font-mono text-xs px-2 py-0.5 rounded-md ${isPos ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>
            {isPos ? '+' : ''}{diff.toFixed(2)}%
          </span>
        );
      };

      return (
        <div className="space-y-6">
          <div className="bg-card rounded-2xl border border-borderSubtle p-5 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="font-semibold text-base text-slate-100">Comparateur de Builds & Rotations (A vs B)</h2>
              <p className="text-xs text-slate-400">
                Enregistrez deux variantes d'équipe, d'armes ou d'artéfacts pour comparer précisément le gain de DPS.
              </p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => saveSnapshot('A')}
                className="px-3.5 py-2 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/40 text-sky-300 text-xs font-semibold"
              >
                Capturer Équipe Actuelle → A
              </button>
              <button
                onClick={() => saveSnapshot('B')}
                className="px-3.5 py-2 rounded-xl bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/40 text-purple-300 text-xs font-semibold"
              >
                Capturer Équipe Actuelle → B
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {[{ label: 'Configuration A', data: compA, accent: 'sky' }, { label: 'Configuration B', data: compB, accent: 'purple' }].map((slot, idx) => (
              <div key={idx} className="bg-card rounded-2xl border border-borderSubtle p-5">
                <div className="flex items-center justify-between border-b border-borderSubtle pb-3 mb-4">
                  <span className={`font-semibold text-sm ${slot.accent === 'sky' ? 'text-sky-400' : 'text-purple-400'}`}>
                    {slot.label}
                  </span>
                  {slot.data && <span className="text-xs text-slate-400">Sauvegardé à {slot.data.timestamp}</span>}
                </div>

                {!slot.data ? (
                  <div className="py-12 text-center text-xs text-slate-500">
                    Aucune donnée enregistrée. Cliquez sur « Capturer Équipe Actuelle » ci-dessus.
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="bg-void p-4 rounded-xl border border-borderSubtle flex items-center justify-between">
                      <div>
                        <div className="text-[11px] text-slate-400 uppercase">DPS Équipe ({slot.data.duration}s)</div>
                        <div className="text-2xl font-mono font-bold text-amber-400">{formatNum(slot.data.dps)} /s</div>
                      </div>
                      <div className="text-right">
                        <div className="text-[11px] text-slate-400 uppercase">DGT Totaux</div>
                        <div className="text-base font-mono text-slate-200">{formatNum(slot.data.totalDamage)}</div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      {slot.data.members.map((m, i) => (
                        <div key={i} className="bg-void/60 p-3 rounded-xl border border-borderSubtle/70 flex items-center justify-between text-xs">
                          <div>
                            <div className="font-semibold text-slate-200">{m.char.name}</div>
                            <div className="text-[11px] text-slate-400">{m.weapon.name}</div>
                          </div>
                          <div className="text-right font-mono">
                            <div className="text-slate-200">{formatNum(m.damage)} DGT</div>
                            <div className="text-[11px] text-amber-400">{m.share.toFixed(1)}%</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>

          {compA && compB && (
            <div className="bg-card rounded-2xl border border-amber-500/40 p-5 flex flex-wrap items-center justify-between gap-4">
              <div>
                <div className="text-xs text-slate-400 uppercase tracking-wider">Différence de Performance (B par rapport à A)</div>
                <div className="text-sm text-slate-200 mt-1">
                  Passage de <span className="font-mono font-semibold text-sky-300">{formatNum(compA.dps)} DPS</span> à{' '}
                  <span className="font-mono font-semibold text-purple-300">{formatNum(compB.dps)} DPS</span>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs text-slate-400">Gain / Perte :</span>
                {renderDelta(compA.dps, compB.dps)}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
